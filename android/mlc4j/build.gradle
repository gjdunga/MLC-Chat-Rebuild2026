plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'ai.mlc.mlcllm'
    compileSdk 37

    defaultConfig {
        minSdk 26
        // JNI entry points and gson/kotlinx models are reached reflectively
        // from native code; keep them when the consuming app runs R8.
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['output']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'output', include: ['*.jar'])
    // Only what the sources import: no AndroidX/Material UI libraries in the
    // engine module (smaller dependency and attack surface).
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
