pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // JitPack builds artifacts from GitHub on demand. Scope it to the one
        // group that needs it, so no other coordinate can be served from it
        // (dependency-confusion defense). Pinned by gradle/verification-metadata.xml.
        exclusiveContent {
            forRepository { maven { url "https://jitpack.io" } }
            filter { includeGroup "com.github.jeziellago" }
        }
    }
}
rootProject.name = "MLCChat"
include ':app'
include ':mlc4j'
project(':mlc4j').projectDir = file('dist/lib/mlc4j')
