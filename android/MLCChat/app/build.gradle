plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing comes from the environment or an untracked keystore.properties,
// never from the repo. 40_build_apk.sh creates a local keystore on first use.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String env ->
    System.getenv(env) ?: keystoreProps.getProperty(key)
}

android {
    namespace 'ai.mlc.mlcchat'
    compileSdk 37
    // Lets AGP find llvm-strip so native debug symbols are removed from the APK.
    ndkVersion System.getenv('S25_NDK_VERSION') ?: '30.0.16248370'

    defaultConfig {
        applicationId "ai.mlc.mlcchat"
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName "1.1-s25"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            // The packed TVM runtime is built for arm64 only.
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'MLC_KEYSTORE')
            if (storePath) {
                storeFile file(storePath)
                storePassword signingValue('storePassword', 'MLC_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'MLC_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'MLC_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig false
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // Store .so files uncompressed and page-aligned so they are mapped
            // directly from the APK (required for 16 KB page-size devices).
            useLegacyPackaging false
        }
    }
    lint {
        // Lint findings are part of the S25 verification gate (50_verify_apk.sh).
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    implementation project(":mlc4j")
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'com.github.jeziellago:compose-markdown:0.7.3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
