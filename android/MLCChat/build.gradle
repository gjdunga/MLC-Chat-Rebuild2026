// Versions verified by a full build for the Galaxy S25 Ultra (Android 17 / API 37).
// AGP 9 compiles Kotlin itself (built-in Kotlin), so the kotlin-android plugin
// is no longer applied; the Compose and serialization compiler plugins still are.
plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.library' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21' apply false
}
